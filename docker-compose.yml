# 서버(app) + DB(MySQL)를 한 번에 띄운다: docker compose up -d --build
# 비밀번호·키 같은 값은 같은 폴더의 .env에서 읽는다 (.env는 Git에 올리지 않는다).
services:
  db:
    image: mysql:8.4
    container_name: wastesorting-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # 내 PC에서만 접속 가능 (127.0.0.1). IntelliJ로 서버를 돌릴 때 이 포트로 붙는다
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: wastesorting-server
    container_name: wastesorting-app
    restart: unless-stopped
    env_file: .env
    environment:
      # 컨테이너끼리는 서비스 이름(db)과 내부 포트(3306)로 접속한다 (.env의 값을 덮어씀)
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 이 컴퓨터 안에서만 접속 (서버에서는 Nginx가 받아서 넘겨 준다)
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
