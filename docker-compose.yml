# 1-2단계: DB(MySQL)만 띄운다. 서버(app)는 1-6단계에서 추가한다.
# 비밀번호 같은 값은 같은 폴더의 .env에서 읽는다 (.env는 Git에 올리지 않는다).
services:
  db:
    image: mysql:8.4
    container_name: wastesorting-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # 내 PC에서만 접속 가능 (127.0.0.1). PC에 다른 MySQL이 있어도 겹치지 않게 3307 사용
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
