spring:
  application:
    name: wastesorting-server
  config:
    # 프로젝트 폴더의 .env 를 설정값으로 읽는다 (없어도 오류 없이 넘어감)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:wastesorting}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # 사진 한 장 2MB, 요청 전체 3MB까지
      max-file-size: 2MB
      max-request-size: 3MB
  jpa:
    hibernate:
      # 개발 중에는 엔티티에 맞춰 테이블을 자동으로 만들고 고친다
      ddl-auto: update
    open-in-view: false

server:
  # 배포 후 Nginx 뒤에서 실행될 때, 사용자 진짜 IP(X-Forwarded-For)를 읽어 IP당 제한이 맞게 동작하도록
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

gemini:
  # 키는 .env 의 GEMINI_API_KEY 에서 읽는다 (여기에 직접 적지 않는다)
  api-key: ${GEMINI_API_KEY:}
  # 앱과 같은 모델. 404가 나면 ai.google.dev 에서 현재 모델명을 확인
  model: gemini-3.1-flash-lite

rate-limit:
  # Gemini 비용 보호. 숫자는 .env 에서 바꿀 수 있다
  per-token-per-minute: ${RATE_PER_TOKEN_PER_MINUTE:20}
  per-ip-per-minute: ${RATE_PER_IP_PER_MINUTE:60}
  device-issue-per-ip-per-hour: ${RATE_DEVICE_ISSUE_PER_IP_PER_HOUR:10}
  daily-ai-cap: ${RATE_DAILY_AI_CAP:500}
  login-per-ip-per-10min: ${RATE_LOGIN_PER_IP_PER_10MIN:10}

guide-cache:
  # 글자 검색 캐시 유효 기간(일). 지나면 Gemini에서 다시 받는다
  ttl-days: ${GUIDE_CACHE_TTL_DAYS:30}

jwt:
  # .env 의 JWT_SECRET (32자 이상, 없으면 서버가 켜지지 않음)
  secret: ${JWT_SECRET:}
  access-minutes: 15
  refresh-days: 14

storage:
  # 오탐 원본 사진 저장 폴더 (Docker에서는 볼륨 /app/uploads)
  upload-dir: ${UPLOAD_DIR:uploads}
  # 이 기간(일)이 지나면 사진과 기록을 지운다
  retention-days: ${UPLOAD_RETENTION_DAYS:90}
