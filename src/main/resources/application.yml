spring:
  application:
    name: wastesorting-server
  config:
    # 프로젝트 폴더의 .env 를 설정값으로 읽는다 (없어도 오류 없이 넘어감)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:wastesorting}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 개발 중에는 엔티티에 맞춰 테이블을 자동으로 만들고 고친다
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
